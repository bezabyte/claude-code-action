name: Verify unavailable PR files
on:
  push:
    branches: [codex-verify-unavailable-pr-files]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Check partial, unavailable, and empty file lists
        run: |
          FIXTURE_FILE_CASE=partial bun run .github/fixtures/verify-unavailable-pr-files.ts
          for simple in false true; do
            USE_SIMPLE_PROMPT="$simple" FIXTURE_FILE_CASE=unavailable bun run .github/fixtures/verify-unavailable-pr-files.ts
            USE_SIMPLE_PROMPT="$simple" FIXTURE_FILE_CASE=empty bun run .github/fixtures/verify-unavailable-pr-files.ts
          done
      - run: bun run typecheck
      - run: bun test
