name: Verify Windows file modes
on:
  push:
    branches: [codex/verify-windows-file-modes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Test feature source without verification-only files
        run: |
          rm src/mcp/verification-baseline-server.ts
          rm scripts/verification/windows-file-modes.ts
          rm .github/workflows/verify-windows-file-modes.yml
          bun test
          bun run typecheck
          bun run format:check
  windows:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun test test/file-mode.test.ts
      - run: bun scripts/verification/windows-file-modes.ts
